<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Akshay AI — Intelligent Assistant</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 30%, rgba(0, 20, 40, 0.75), rgba(0, 0, 0, 0.85)),
                url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');
            background-size: cover;
            background-position: center 30%;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }

        /* floating chat bubble (logo + button) */
        .chat-launcher {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 2000;
            cursor: pointer;
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.3));
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .chat-launcher:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 18px 28px rgba(0, 123, 255, 0.4));
        }

        .launcher-btn {
            width: 72px;
            height: 72px;
            background: linear-gradient(145deg, #ffffff, #f0f4ff);
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2), 0 0 0 3px rgba(255, 255, 255, 0.5);
            transition: 0.2s;
            border: none;
            cursor: pointer;
        }

        /* BOT AVATAR IMAGE — FIXED: shows actual robot/assistant icon, no broken image */
        .launcher-btn img {
            width: 58px;
            height: 58px;
            object-fit: contain;
            border-radius: 50%;
            display: block;
            background: white;
            padding: 5px;
        }

        /* main modal — glassmorphism refined */
        .chat-modal {
            display: none;
            position: fixed;
            bottom: 110px;
            right: 28px;
            width: 420px;
            max-width: calc(100vw - 32px);
            height: 680px;
            max-height: 80vh;
            background: rgba(20, 25, 38, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.15);
            flex-direction: column;
            overflow: hidden;
            z-index: 2001;
            font-family: 'Inter', sans-serif;
            animation: fadeSlideUp 0.2s ease-out;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* header with logo, brand and close */
        .chat-header {
            background: rgba(0, 123, 255, 0.85);
            backdrop-filter: blur(4px);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header-avatar {
            width: 44px;
            height: 44px;
            background: white;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        /* logo image inside header — same reliable bot graphic */
        .header-avatar img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 50%;
        }

        .header-text {
            flex: 1;
        }

        .header-text h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            letter-spacing: -0.2px;
        }

        .header-text p {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 2px;
        }

        .close-btn {
            background: rgba(0, 0, 0, 0.3);
            width: 32px;
            height: 32px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 400;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }

        .close-btn:hover {
            background: rgba(0, 0, 0, 0.55);
            transform: scale(0.96);
        }

        /* messages container */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .messages-area::-webkit-scrollbar {
            width: 5px;
        }

        .messages-area::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .messages-area::-webkit-scrollbar-thumb {
            background: #007bff;
            border-radius: 10px;
        }

        /* message bubbles */
        .msg {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 24px;
            font-size: 0.9rem;
            line-height: 1.45;
            word-wrap: break-word;
            font-weight: 500;
            animation: messagePop 0.2s ease;
        }

        @keyframes messagePop {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #007bff, #0066d6);
            color: white;
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.2);
        }

        .bot {
            align-self: flex-start;
            background: rgba(235, 240, 250, 0.9);
            backdrop-filter: blur(4px);
            color: #0a1929;
            border-bottom-left-radius: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        /* typing indicator */
        .typing-dots {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background: #4a6a8b;
            border-radius: 50%;
            display: inline-block;
            animation: wave 1.2s infinite ease-in-out;
        }

        .typing-dots span:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes wave {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        /* input bar area */
        .input-container {
            padding: 16px 18px 20px;
            background: rgba(15, 20, 30, 0.8);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-field {
            flex: 1;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 40px;
            padding: 12px 20px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            color: white;
            outline: none;
            transition: all 0.2s;
        }

        .input-field:focus {
            border-color: #007bff;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.3);
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
        }

        .input-field:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .send-button {
            background: #007bff;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
        }

        .send-button:hover:not(:disabled) {
            background: #0062cc;
            transform: scale(1.02);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .send-button svg {
            fill: white;
            width: 22px;
            height: 22px;
        }

        /* error style */
        .error-message {
            color: #ffb3b3;
            background: rgba(180, 40, 40, 0.85);
        }

        /* responsive */
        @media (max-width: 500px) {
            .chat-modal {
                width: calc(100vw - 24px);
                right: 12px;
                bottom: 100px;
                height: 70vh;
                max-height: 70vh;
            }

            .launcher-btn {
                width: 64px;
                height: 64px;
            }

            .launcher-btn img {
                width: 52px;
                height: 52px;
            }
        }
    </style>
</head>

<body>

    <!-- floating button with logo image (FIXED: working bot image, no broken icon) -->
    <div class="chat-launcher" id="openBtn">
        <div class="launcher-btn">
            <img id="logoImg" src="logo.jpg" alt="AI Bot Logo"
                onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/4712/4712107.png';">
        </div>
    </div>

    <!-- Chat modal panel -->
    <div id="chatModal" class="chat-modal">
        <div class="chat-header">
            <div class="header-avatar">
                <img src="logo.jpg" alt="Bot Avatar"
                    onerror="this.src='https://cdn-icons-png.flaticon.com/512/4712/4712107.png';">
            </div>
            <div class="header-text">
                <h3>Akshay AI</h3>
                <p>⚡ Always online · instant replies</p>
            </div>
            <div class="close-btn" id="closeChatBtn">✕</div>
        </div>

        <div id="messages" class="messages-area">
            <div class="msg bot">✨ Hey, I'm Akshay AI. Ask me anything — tech, ideas, or just a friendly chat!</div>
        </div>

        <div class="input-container">
            <input type="text" id="input" class="input-field" placeholder="Type your message..." autocomplete="off">
            <button id="sendBtn" class="send-button" aria-label="Send">
                <svg viewBox="0 0 24 24" width="22" height="22">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // ---------- DOM elements ----------
        const modal = document.getElementById('chatModal');
        const openBtn = document.getElementById('openBtn');
        const closeChatBtn = document.getElementById('closeChatBtn');
        const messagesDiv = document.getElementById('messages');
        const inputField = document.getElementById('input');
        const sendButton = document.getElementById('sendBtn');

        let isBotResponding = false;   // lock while bot generates answer
        let abortController = null;     // optional abort for pending request

        // Helper: disable input + send button during waiting
        function setUIEnabled(enabled) {
            const isDisabled = !enabled;
            inputField.disabled = isDisabled;
            sendButton.disabled = isDisabled;
            if (isDisabled) {
                inputField.style.cursor = 'not-allowed';
                sendButton.style.cursor = 'not-allowed';
            } else {
                inputField.style.cursor = 'text';
                sendButton.style.cursor = 'pointer';
            }
            // keep focus if enabled
            if (enabled) inputField.focus();
        }

        // scroll latest message into view
        function scrollToBottom() {
            messagesDiv.scrollTo({
                top: messagesDiv.scrollHeight,
                behavior: 'smooth'
            });
        }

        // add a new message to chat (type: 'user' or 'bot')
        function appendMessage(text, sender, isError = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${sender}`;
            if (isError && sender === 'bot') {
                msgDiv.classList.add('error-message');
            }
            msgDiv.textContent = text;
            messagesDiv.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv;
        }

        // create temporary bot typing indicator (return its ID element)
        function addTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'msg bot';
            typingDiv.id = `typing-${Date.now()}`;
            typingDiv.innerHTML = `
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
                <span style="font-size:0.75rem; margin-left: 6px; opacity:0.7;">Akshay AI is thinking</span>
            `;
            messagesDiv.appendChild(typingDiv);
            scrollToBottom();
            return typingDiv;
        }

        // remove typing indicator from DOM
        function removeTypingIndicator(indicatorElem) {
            if (indicatorElem && indicatorElem.parentNode) {
                indicatorElem.remove();
            }
        }

        // core send message logic with robust fetch & error handling
        async function sendMessage() {
            // prevent double sending when bot is already processing
            if (isBotResponding) {
                // subtle visual feedback: shake input maybe
                inputField.style.transform = 'scale(0.99)';
                setTimeout(() => { inputField.style.transform = ''; }, 200);
                return;
            }

            const rawMessage = inputField.value.trim();
            if (!rawMessage) return;

            // clear input
            inputField.value = '';

            // 1) Append user message immediately
            appendMessage(rawMessage, 'user');

            // 2) Lock UI and prepare for bot response
            isBotResponding = true;
            setUIEnabled(false);

            // 3) Show typing indicator
            const typingIndicator = addTypingIndicator();

            // optional abort controller to cancel stale request if another is sent (but we lock so not needed)
            if (abortController) {
                try { abortController.abort(); } catch (e) { /* ignore */ }
            }
            abortController = new AbortController();
            const signal = abortController.signal;

            try {
                // Request to Python Flask backend (localhost:5000/chat)
                const response = await fetch("http://127.0.0.1:5000/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: rawMessage }),
                    signal: signal
                });

                // remove typing indicator before actual response
                removeTypingIndicator(typingIndicator);

                if (!response.ok) {
                    const errorText = `Server error (${response.status}). Please try again.`;
                    appendMessage(errorText, 'bot', true);
                    scrollToBottom();
                    return;
                }

                const data = await response.json();
                let botReply = data.reply || "Hmm, I didn't get that. Could you rephrase?";

                // Ensure reply is a string
                if (typeof botReply !== 'string') botReply = String(botReply);
                // Append bot final answer
                appendMessage(botReply, 'bot', false);

            } catch (err) {
                // remove typing indicator if present
                removeTypingIndicator(typingIndicator);
                let errorMsg = "⚠️ Connection error: Could not reach AI server. Make sure backend is running on port 5000.";
                if (err.name === 'AbortError') {
                    errorMsg = "Request cancelled.";
                } else if (err.message.includes('Failed to fetch')) {
                    errorMsg = "🔌 Cannot connect to server. Please check if Flask backend is active (http://127.0.0.1:5000).";
                }
                appendMessage(errorMsg, 'bot', true);
                console.error("Chat fetch error:", err);
            } finally {
                // unlock UI
                isBotResponding = false;
                setUIEnabled(true);
                abortController = null;
                // focus input again
                inputField.focus();
                scrollToBottom();
            }
        }

        // event listeners: send on click or press Enter
        sendButton.addEventListener('click', sendMessage);

        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isBotResponding && inputField.value.trim() !== '') {
                e.preventDefault();
                sendMessage();
            }
        });

        // Toggle chat modal visibility
        function toggleChat(forceOpen = null) {
            const isVisible = modal.style.display === 'flex';
            if (forceOpen === true || (forceOpen === undefined && !isVisible)) {
                modal.style.display = 'flex';
                modal.style.flexDirection = 'column';
                // focus input when opening
                setTimeout(() => {
                    if (!isBotResponding) inputField.focus();
                }, 100);
            } else {
                modal.style.display = 'none';
            }
        }

        // open/close behavior 
        openBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleChat(true);
        });

        closeChatBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        // click outside optional? (improve ux - but we keep clean)
        window.addEventListener('click', (e) => {
            // if modal open and click outside modal & not on openBtn then close
            if (modal.style.display === 'flex') {
                const isClickInside = modal.contains(e.target);
                const isClickOnLauncher = openBtn.contains(e.target);
                if (!isClickInside && !isClickOnLauncher) {
                    modal.style.display = 'none';
                }
            }
        });

        // initial state: modal hidden, but ready
        modal.style.display = 'none';

        // Pre-focus helper, ensure logo image robust (multiple fallback for any broken image)
        // fix logo show bot image: we already use high quality CDN with fallback error handling
        const allBotImages = document.querySelectorAll('img');
        allBotImages.forEach(img => {
            img.addEventListener('error', function (e) {
                // ultimate fallback if both original and onerror fail
                if (!this.src.includes('4712107')) {
                    this.src = 'https://cdn-icons-png.flaticon.com/512/4712/4712107.png';
                } else {
                    // final base64 cute bot emoji as last resort
                    this.src = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Ccircle cx="50" cy="50" r="45" fill="%23007bff"/%3E%3Ctext x="50" y="70" font-size="50" text-anchor="middle" fill="white"%3E🤖%3C/text%3E%3C/svg%3E';
                }
            });
        });

        // Additional small details: show typing status if modal gets open while bot loading? guard
        // Also adding a style for smooth background consistency
        // Set a welcoming message with timestamp style 
        // everything is polished: glassmorphism, scrollbar, bot image fixed with multiple fallbacks, error handling.
        console.log('✨ Akshay AI — Perfect UI, Logo image secure, backend ready');
    </script>
</body>

</html>
